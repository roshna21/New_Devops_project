services:
  mongodb:
    image: mongo:8.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  nova-backend:
    build: ./backend
    container_name: nova-backend
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=development
      - PORT=5001
      - JWT_SECRET=your_super_secret_jwt_key_12345
      - MONGODB_URI=mongodb://mongodb:27017/nova-chat
      - SOLUTIONSYNC_URL=http://localhost:3000/api/analyze
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  nova-frontend:
    build: ./frontend
    container_name: nova-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://nova-backend:5001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      nova-backend:
        condition: service_healthy

volumes:
  mongodb_data:
