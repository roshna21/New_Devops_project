apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-frontend
  namespace: novachat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nova-frontend
  template:
    metadata:
      labels:
        app: nova-frontend
    spec:
      containers:
      - name: nova-frontend
        # See backend.yaml for why this is IfNotPresent and how the image gets into
        # the node's containerd store.
        image: roshna21/selfhealingsys-nova-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5173
        env:
        # The /api and /socket.io proxy lives in the Vite dev server, so the image
        # runs `vite` rather than a static build.
        - name: VITE_API_PROXY_TARGET
          value: "http://nova-backend:5001"
        readinessProbe:
          httpGet:
            path: /
            port: 5173
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: nova-frontend
  namespace: novachat
spec:
  type: NodePort
  selector:
    app: nova-frontend
  ports:
  - port: 5173
    targetPort: 5173
    nodePort: 30173
